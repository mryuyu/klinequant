<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KlineQuant v1.1 轻量版 — 真实数据演示</title>
<style>
/* ═══ 设计 Tokens（V1 已定版配色） ═══ */
:root {
  --bg-base: #131722;
  --bg-panel: #1e222d;
  --bg-elevated: #2a2e39;
  --border: #2a2e39;
  --border-light: #363a45;
  --text: #d1d4dc;
  --text-sub: #787b86;
  --accent: #00d4aa;
  --accent-dim: rgba(0,212,170,0.12);
  --up: #0ecb81;
  --down: #f6465d;
  --up-rgb: 14,203,129;
  --down-rgb: 246,70,93;
  --warning: #f0b90b;
  --ma7: #f0b90b;
  --ma25: #2962ff;
  /* 面板宽度默认值（拖拽分隔条时由 JS 动态更新） */
  --trade-w: 300px;
  --sym-w: 264px;
  --pos-h: 150px;
  --font-ui: 'Inter','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono: 'JetBrains Mono','Consolas',monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { background:var(--bg-base); color:var(--text); font-family:var(--font-ui); font-size:13px; overflow:hidden; }
.mono { font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
.up { color:var(--up); } .down { color:var(--down); } .muted { color:var(--text-sub); }
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:3px; }

.app { display:grid; grid-template-rows:48px 1fr 26px; height:100vh; }

/* ── 顶栏 ── */
.topbar { display:flex; align-items:center; gap:16px; background:var(--bg-panel); border-bottom:1px solid var(--border); padding:0 14px; }
.logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; }
.logo-mark { width:24px; height:24px; border-radius:6px; background:linear-gradient(135deg,var(--accent),#0084ff); display:flex; align-items:center; justify-content:center; font-size:13px; color:#0b0e14; font-weight:900; }
.symbol-picker { display:flex; align-items:center; gap:10px; background:var(--bg-elevated); border-radius:6px; padding:6px 12px; cursor:pointer; border:1px solid transparent; }
.symbol-picker:hover { border-color:var(--border-light); }
.symbol-name { font-weight:700; font-size:14px; }
.symbol-tag { font-size:10px; padding:2px 6px; border-radius:3px; background:var(--accent-dim); color:var(--accent); font-weight:600; }
.ticker { display:flex; gap:22px; }
.ticker-item { display:flex; flex-direction:column; gap:1px; }
.ticker-label { font-size:10px; color:var(--text-sub); }
.ticker-value { font-size:13px; font-weight:600; }
.dot { width:7px; height:7px; border-radius:50%; background:#0ecb81; animation:pulse 2s infinite; display:inline-block; }   /* 连接状态色固定，不随涨跌配色方案交换 */
@keyframes pulse { 50%{opacity:.4;} }
.conn { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-sub); }

/* ── 主体 ── */
.main { display:grid; grid-template-columns:56px 1fr 6px var(--trade-w,300px) 6px var(--sym-w,264px); min-height:0; }
/* 拖拽分隔条 */
.split { background:var(--border); cursor:col-resize; position:relative; transition:background .15s; }
.split:hover, .split.dragging { background:var(--accent); }
.split::after { content:''; position:absolute; top:0; bottom:0; left:-3px; right:-3px; }
.split-h { cursor:row-resize; }
.split-h::after { left:0; right:0; top:-3px; bottom:-3px; }

/* 侧边导航 */
.sidebar { background:var(--bg-panel); border-right:1px solid var(--border); display:flex; flex-direction:column; align-items:center; padding:10px 0; gap:4px; }
.nav-item { width:42px; height:42px; border-radius:8px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; cursor:pointer; color:var(--text-sub); font-size:9px; transition:all .15s; }
.nav-item svg { width:18px; height:18px; }
.nav-item:hover { background:var(--bg-elevated); color:var(--text); }
.nav-item.active { background:var(--accent-dim); color:var(--accent); }
.sidebar-spacer { flex:1; }

/* 中央 */
.center { display:flex; flex-direction:column; min-width:0; min-height:0; }
.chart-toolbar { display:flex; align-items:center; gap:6px; padding:6px 12px; border-bottom:1px solid var(--border); }
.tf-btn { padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; color:var(--text-sub); background:none; border:none; font-family:var(--font-ui); }
.tf-btn:hover { color:var(--text); background:var(--bg-elevated); }
.tf-btn.active { color:var(--accent); background:var(--accent-dim); font-weight:600; }
.toolbar-sep { width:1px; height:18px; background:var(--border); margin:0 6px; }
.tool-btn { display:flex; align-items:center; gap:5px; padding:4px 8px; border-radius:4px; cursor:pointer; font-size:12px; color:var(--text-sub); background:none; border:none; }
.tool-btn:hover { background:var(--bg-elevated); color:var(--text); }
.tool-btn svg { width:15px; height:15px; }
/* 图例内指标参数齿轮按钮（图例行已 pointer-events:auto，无需单独放开） */

.chart-wrap { flex:1; position:relative; min-height:0; }
#chart { position:absolute; inset:0; }
.legend {
  position:absolute; top:10px; left:12px; z-index:5; pointer-events:none;
  display:flex; flex-direction:column; gap:4px; font-size:12px;
}
.legend-row { display:flex; gap:10px; align-items:center; background:rgba(19,23,34,0.72); padding:3px 8px; border-radius:4px; width:max-content; pointer-events:auto; }   /* 图例行隔离十字光标：防止悬停时数值回退→行宽变化→齿轮位移闪烁 */
.gear-btn { display:inline-flex; align-items:center; background:none; border:none; color:var(--text-sub); cursor:pointer; padding:2px; border-radius:4px; flex:none; }
.gear-btn:hover { color:var(--accent); background:var(--bg-elevated); }
.gear-btn svg { width:12px; height:12px; }
.ctx-menu { position:fixed; z-index:200; display:none; min-width:132px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:8px; padding:6px; box-shadow:0 8px 24px rgba(0,0,0,.5); font-size:12px; }
.ctx-menu.show { display:block; }
.ctx-title { color:var(--text-sub); padding:4px 10px 6px; font-size:11px; }
.ctx-row { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:5px 10px; color:var(--text-sub); }
.ctx-input { width:70px; background:var(--bg-base); border:1px solid var(--border); color:var(--text); border-radius:4px; font-size:12px; padding:3px 6px; outline:none; font-family:var(--font-ui); }
.ctx-input:focus { border-color:var(--accent); }
.ctx-row input[type="checkbox"] { width:14px; height:14px; accent-color:var(--accent); cursor:pointer; }
.watermark { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:800; color:rgba(209,212,220,0.05); pointer-events:none; letter-spacing:4px; z-index:0; }

/* 底部持仓（高度可拖拽 + 可折叠隐藏） */
.positions-bar { border-top:1px solid var(--border); background:var(--bg-panel); height:var(--pos-h,150px); display:flex; flex-direction:column; }
.positions-bar.collapsed { height:34px; flex:none; }
.positions-bar.collapsed .pos-scroll { display:none; }
.tabs { display:flex; align-items:center; border-bottom:1px solid var(--border); padding:0 12px; }
.positions-bar.collapsed .tabs { border-bottom:none; height:33px; }
.tab { padding:8px 14px; font-size:12px; color:var(--text-sub); cursor:pointer; border-bottom:2px solid transparent; }
.tab.active { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
.tab .count { margin-left:4px; font-size:10px; padding:1px 5px; border-radius:8px; background:var(--bg-elevated); }
.pos-collapse { margin-left:auto; width:26px; height:26px; border:none; border-radius:5px; background:none; color:var(--text-sub); cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; }
.pos-collapse:hover { background:var(--bg-elevated); color:var(--accent); }
.pos-collapse svg { width:14px; height:14px; transition:transform .2s; }
.positions-bar.collapsed .pos-collapse svg { transform:rotate(180deg); }
.pos-scroll { flex:1; overflow-y:auto; }
table { width:100%; border-collapse:collapse; font-size:12px; }
th { text-align:left; padding:6px 12px; color:var(--text-sub); font-weight:500; font-size:11px; position:sticky; top:0; background:var(--bg-panel); }
td { padding:7px 12px; border-top:1px solid var(--border); }

/* 右栏 */
.right-panel { border-left:1px solid var(--border); background:var(--bg-panel); display:flex; flex-direction:column; min-height:0; }
.panel-tabs { display:flex; border-bottom:1px solid var(--border); }
.panel-tab { flex:1; text-align:center; padding:10px 0; font-size:12px; cursor:pointer; color:var(--text-sub); border-bottom:2px solid transparent; }
.panel-tab.active { color:var(--text); border-bottom-color:var(--accent); font-weight:600; }
.qtrade { padding:14px; }
.side-btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px; }
.side-btn { padding:9px 0; border:none; border-radius:6px; font-size:13px; font-weight:700; cursor:pointer; }
.side-buy { background:rgba(var(--up-rgb),0.15); color:var(--up); border:1px solid rgba(var(--up-rgb),0.4); }
.side-buy.selected { background:var(--up); color:#0b0e14; }
.side-sell { background:rgba(var(--down-rgb),0.1); color:var(--down); border:1px solid rgba(var(--down-rgb),0.3); }
.field { margin-bottom:10px; }
.field-label { display:flex; justify-content:space-between; font-size:11px; color:var(--text-sub); margin-bottom:4px; }
.input-box { display:flex; align-items:center; background:var(--bg-base); border:1px solid var(--border); border-radius:6px; padding:0 10px; height:34px; }
.input-box:focus-within { border-color:var(--accent); }
.input-box input { flex:1; background:none; border:none; outline:none; color:var(--text); font-family:var(--font-mono); font-size:13px; width:60px; }
/* 隐藏 number 输入框原生上下箭头微调器（暗色背景下会显示成独立灰色块，视觉上像双框） */
.input-box input[type="number"] { -moz-appearance:textfield; appearance:textfield; }
.input-box input[type="number"]::-webkit-inner-spin-button,
.input-box input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
.input-suffix { font-size:11px; color:var(--text-sub); }
.pct-row { display:flex; gap:4px; margin:8px 0 12px; }
.pct-btn { flex:1; padding:4px 0; font-size:11px; background:var(--bg-base); border:1px solid var(--border); border-radius:4px; color:var(--text-sub); cursor:pointer; }
.pct-btn:hover { border-color:var(--accent); color:var(--accent); }
.submit-btn { width:100%; padding:11px 0; border:none; border-radius:6px; background:var(--up); color:#0b0e14; font-size:14px; font-weight:700; cursor:pointer; }
/* 品种列表栏（最右独立栏） */
.symbols-col { border-left:1px solid var(--border); background:var(--bg-panel); display:flex; flex-direction:column; min-height:0; }
.tf-btn:disabled { opacity:0.3; cursor:default; }
.sc-head { display:flex; align-items:center; justify-content:space-between; padding:12px 12px 8px; }
.sc-title { font-weight:700; font-size:14px; }
.sc-actions { display:flex; gap:4px; }
.sc-btn { width:24px; height:24px; border-radius:5px; border:none; background:var(--bg-elevated); color:var(--text-sub); cursor:pointer; font-size:14px; line-height:1; display:flex; align-items:center; justify-content:center; }
.sc-btn:hover { color:var(--accent); background:var(--border-light); }
.sc-search { margin:0 12px 8px; }
.sc-search input { width:100%; background:var(--bg-base); border:1px solid var(--border); border-radius:6px; padding:6px 10px; color:var(--text); font-size:12px; outline:none; }
.sc-search input:focus { border-color:var(--accent); }
.sc-body { flex:1; overflow-y:auto; min-height:0; }
.wl-group-head { display:flex; align-items:center; gap:6px; padding:8px 12px 4px; font-size:11px; color:var(--text-sub); cursor:pointer; user-select:none; }
.wl-group-head:hover { color:var(--text); }
.wl-group-head .cnt { margin-left:auto; background:var(--bg-elevated); border-radius:8px; padding:0 6px; font-size:10px; }
.wl-group-head .caret { transition:transform .15s; font-size:9px; }
.wl-group-head.collapsed .caret { transform:rotate(-90deg); }
.wl-row { display:grid; grid-template-columns:20px 1fr auto auto 14px; gap:7px; align-items:center; padding:6px 12px; cursor:pointer; font-size:12.5px; }
.wl-row:hover { background:var(--bg-elevated); }
.wl-row.active { background:var(--accent-dim); }
.wl-ico { width:18px; height:18px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:#0b0e14; }
.wl-name { font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.wl-val { font-family:var(--font-mono); }
.wl-chg { font-family:var(--font-mono); font-size:11.5px; min-width:56px; text-align:right; }
.wl-del { opacity:0; color:var(--text-sub); font-size:13px; text-align:center; cursor:pointer; }
.wl-row:hover .wl-del { opacity:1; }
.wl-del:hover { color:var(--down); }
/* 添加品种弹窗 */
.modal-mask { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:none; align-items:center; justify-content:center; z-index:100; }
.modal-mask.show { display:flex; }
.modal { width:320px; background:var(--bg-panel); border:1px solid var(--border-light); border-radius:10px; padding:18px; }
.modal h3 { font-size:14px; margin-bottom:14px; }
.modal .field-label { display:block; font-size:11px; color:var(--text-sub); margin:10px 0 4px; }
.modal input, .modal select { width:100%; background:var(--bg-base); border:1px solid var(--border); border-radius:6px; padding:8px 10px; color:var(--text); font-size:13px; outline:none; }
/* 弹窗内 .input-box 嵌套输入框：覆盖上方 .modal input 的边框/背景/内边距，避免双层框（同优先级时后者生效） */
.modal .input-box input { background:none; border:none; border-radius:0; padding:0; }
.modal input:focus, .modal select:focus { border-color:var(--accent); }
.modal .input-box input:focus { border-color:transparent; box-shadow:none; }
.modal-btns { display:flex; gap:8px; margin-top:16px; }
.modal-btns button { flex:1; padding:8px 0; border-radius:6px; border:none; cursor:pointer; font-size:13px; }
.m-cancel { background:var(--bg-elevated); color:var(--text); }
.m-ok { background:var(--accent); color:#0b0e14; font-weight:700; }
.m-remove { background:rgba(var(--down-rgb),0.10); color:var(--down); border:1px solid rgba(var(--down-rgb),0.35); }
.m-remove:hover { background:rgba(var(--down-rgb),0.22); }
/* 添加指标选择面板 */
.pick-row { display:flex; justify-content:space-between; align-items:center; padding:8px 10px; border-radius:6px; cursor:pointer; }
/* ── 品种搜索弹窗（TradingView 式：市场分类页签 + 地区筛选，数据源对用户隐藏） ── */
.sr-modal { width:620px; max-width:92vw; padding:0; overflow:hidden; }
.sr-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; }
.sr-title { font-weight:700; font-size:14px; }
.sr-close { background:none; border:none; color:var(--text-sub); font-size:15px; cursor:pointer; padding:2px 7px; border-radius:4px; }
.sr-close:hover { color:var(--text); background:var(--bg-elevated); }
.sr-search { margin:0 16px 10px; display:flex; align-items:center; gap:8px; background:var(--bg-base); border:1px solid var(--border-light); border-radius:8px; padding:8px 12px; }
.sr-search svg { width:15px; height:15px; color:var(--text-sub); flex:none; }
.sr-search input { flex:1; background:none; border:none; outline:none; color:var(--text); font-size:13px; padding:0; }
.sr-search input:focus { border-color:transparent; box-shadow:none; }
.mkt-tabs { display:flex; gap:6px; padding:0 16px 10px; flex-wrap:wrap; }
.mkt-pill { padding:5px 12px; border-radius:14px; border:none; background:var(--bg-elevated); color:var(--text-sub); font-size:12px; cursor:pointer; }
.mkt-pill:hover { color:var(--text); }
.mkt-pill.active { background:#4a4e59; color:#fff; font-weight:600; }
.sr-filter { display:flex; align-items:center; gap:8px; padding:0 16px 8px; min-height:30px; }
.region-seg { display:flex; background:var(--bg-base); border:1px solid var(--border); border-radius:14px; padding:2px; }
.region-btn { border:none; background:none; color:var(--text-sub); font-size:11.5px; padding:3px 12px; border-radius:11px; cursor:pointer; }
.region-btn.active { background:var(--bg-elevated); color:var(--text); font-weight:600; }
.sr-body { height:320px; overflow-y:auto; border-top:1px solid var(--border); }
.sr-row { display:flex; align-items:center; gap:10px; padding:8px 16px; cursor:pointer; }
.sr-row:hover { background:var(--bg-elevated); }
.sr-row.active { background:var(--accent-dim); }
.sr-ico { width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:700; color:#0b0e14; flex:none; }
.sr-sym { font-weight:700; font-size:13px; min-width:92px; }
.sr-desc { color:var(--text-sub); font-size:12px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sr-type { font-size:10px; padding:2px 6px; border-radius:3px; background:var(--bg-elevated); color:var(--text-sub); flex:none; }
.sr-src { font-size:11px; color:var(--text-sub); flex:none; min-width:64px; text-align:right; }   /* 数据源展示名（仿 TradingView 行尾来源） */
.sr-more { padding:10px 16px; text-align:center; color:var(--text-sub); font-size:11.5px; }
.sr-empty { padding:56px 16px; text-align:center; color:var(--text-sub); font-size:12.5px; line-height:2; }
.sr-empty b { color:var(--warning); }
.pick-row:hover { background:var(--bg-elevated); }
.pick-row .pk-name { font-weight:600; font-size:13px; }
.pick-row .pk-desc { font-size:11px; color:var(--text-sub); margin-top:1px; }
.pick-row .pk-add { color:var(--accent); font-size:15px; flex:none; margin-left:10px; }
.pk-group { font-size:11px; color:var(--text-sub); padding:6px 2px 4px; }

/* 状态栏（靠右显示：交易所 + WS 实时延迟） */
.statusbar { display:flex; align-items:center; justify-content:flex-end; gap:16px; background:var(--bg-panel); border-top:1px solid var(--border); padding:0 16px; font-size:11px; color:var(--text-sub); }
</style>
</head>
<body>
<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="logo"><div class="logo-mark">K</div>KlineQuant</div>
    <div class="symbol-picker" id="symbol-picker" title="品种搜索">
      <span class="symbol-name" id="top-symbol">BTCUSDT</span><span class="symbol-tag" id="top-tag">SPOT</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
    </div>
    <div class="ticker mono">
      <div class="ticker-item"><span class="ticker-label">最新价</span><span class="ticker-value up" id="tk-price">--</span></div>
      <div class="ticker-item"><span class="ticker-label">24h 涨跌</span><span class="ticker-value" id="tk-chg">--</span></div>
      <div class="ticker-item"><span class="ticker-label">24h 高</span><span class="ticker-value" id="tk-high">--</span></div>
      <div class="ticker-item"><span class="ticker-label">24h 低</span><span class="ticker-value" id="tk-low">--</span></div>
    </div>
  </header>

  <div class="main">
    <!-- 侧边导航 -->
    <nav class="sidebar">
      <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17l5-6 4 3 6-8 3 4"/><path d="M3 21h18"/></svg>行情</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4v16M17 4v16M4 8h6M14 16h6"/></svg>交易</div>
      <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>策略</div>

<script>
const { createChart, CandlestickSeries, HistogramSeries, LineSeries } = LightweightCharts;

/* ═══ 真实数据接入（后端 REST + WS） ═══ */

let curSymbol = 'BTCUSDT';
let curTf = '15m';
let curExchange = 'binance';    // 当前市场源（binance/ig，后端插件注册表驱动）

function setSb(txt) { document.getElementById('sb-status').textContent = txt; }

/* ═══ 涨跌配色方案（全局）：gd=绿涨红跌（默认）/ cn=红涨绿跌；

let colorScheme = localStorage.getItem('kq-color-scheme') === 'cn' ? 'cn' : 'gd';
let CS = COLOR_SCHEMES[colorScheme];
const applySchemeVars = () => {

const volColor = (c, o) => `rgba(${c >= o ? CS.upRgb : CS.downRgb},0.32)`;   // 成交量柱：随方案
const histColor = v => `rgba(${v >= 0 ? CS.upRgb : CS.downRgb},0.55)`;       // MACD 柱：随方案

/* ═══ 布局持久化（localStorage：面板尺寸/折叠/K线数/右侧留白/周期/品种） ═══ */

const TF_VALID = ['1m', '5m', '15m', '1h', '4h', '1d'];

try { savedLayout = JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) {}
if (savedLayout) {

  if (savedLayout.klineCount) klineCount = savedLayout.klineCount;
  if (savedLayout.tf && TF_VALID.includes(savedLayout.tf)) curTf = savedLayout.tf;
  if (savedLayout.symbol) curSymbol = savedLayout.symbol;
  if (savedLayout.exchange) curExchange = savedLayout.exchange;

  if (typeof savedLayout.showVol === 'boolean') showVol = savedLayout.showVol;
}
function saveLayout() {
  try {
    const st = document.documentElement.style;
    localStorage.setItem(LS_KEY, JSON.stringify({
      tradeW: st.getPropertyValue('--trade-w'),
      symW: st.getPropertyValue('--sym-w'),
      posH: st.getPropertyValue('--pos-h'),
      posCollapsed: document.getElementById('pos-bar')?.classList.contains('collapsed') || false,

      symbol: curSymbol,
      exchange: curExchange,

  } catch (e) {}
}
// 同步 UI 控件与恢复后的状态
{
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === curTf));
  document.getElementById('top-symbol').textContent = curSymbol;
  document.querySelector('.watermark').textContent = curSymbol;
}

/* ═══ 指标目录 + indLayout（有序实例列表：布局持久化/渲染/参数弹窗同源，对齐后端 display_meta 契约） ═══ */
const IND_CATALOG = {
  ma:   { title: 'MA 均线',        pane: 'main', desc: '双均线（短/长周期）',        defaults: { short: 7, long: 25 } },
  boll: { title: 'BOLL 布林带',    pane: 'main', desc: '中轨 ± N 倍标准差',          defaults: { period: 20, mult: 2 } },
  macd: { title: 'MACD',           pane: 'sub',  desc: 'DIF/DEA 与柱状图', h: 120, defaults: { fast: 12, slow: 26, signal: 9 } },
  kd:   { title: 'KD 随机指标',    pane: 'sub',  desc: 'K/D 超买超卖',       h: 100, defaults: { n: 9, m: 3 } },
  rsi:  { title: 'RSI 相对强弱',   pane: 'sub',  desc: 'Wilder 平滑 RSI',    h: 100, defaults: { period: 14 } },
};
const IND_META = {
  ma:   { title: 'MA 均线参数', fields: [
    { key: 'short', label: '短周期', min: 2, max: 'kline' },
    { key: 'long',  label: '长周期', min: 2, max: 'kline' }] },
  boll: { title: 'BOLL 布林带参数', fields: [
    { key: 'period', label: '周期', min: 2, max: 'kline' },
    { key: 'mult',   label: '标准差倍数', min: 0.5, max: 10, step: 0.1 }] },
  macd: { title: 'MACD 参数', fields: [
    { key: 'fast',   label: '快线 EMA', min: 2, max: 'kline' },
    { key: 'slow',   label: '慢线 EMA', min: 3, max: 'kline' },
    { key: 'signal', label: '信号线 EMA', min: 2, max: 'kline' }] },
  kd:   { title: 'KD 随机指标参数', fields: [
    { key: 'n', label: 'RSV 周期', min: 2, max: 'kline' },
    { key: 'm', label: '平滑周期', min: 2, max: 'kline' }] },
  rsi:  { title: 'RSI 相对强弱参数', fields: [
    { key: 'period', label: '周期', min: 2, max: 'kline' }] },
};
/* 周期类参数上限动态跟随 K 线总量上限（klineCount，右键菜单可调 100~5000） */
function fieldMax(f) { return f.max === 'kline' ? klineCount : f.max; }

/* ═══ IND-110：后端 def 式指标目录（/api/indicator/meta 驱动，后端注册新指标前端自动发现） ═══ */
let BACKEND_META = {};   // name -> {min_periods, display_meta, default_params}
async function fetchBackendMeta() {
  try {
    const json = await (await fetch(`${API}/api/indicator/meta`)).json();
    for (const it of json.indicators || []) BACKEND_META[it.name] = it;
  } catch (e) { /* 后端未连时保持内置指标可用 */ }
}
/* 已有专属渲染/计算通路的内置指标（不列入自定义组） */
const FE_HANDLED = new Set(['MA', 'BOLL', 'MACD', 'KDJ', 'RSI']);
function customCatalog() {
  const out = {};
  for (const [name, m] of Object.entries(BACKEND_META)) {
    if (FE_HANDLED.has(name)) continue;
    const dm = m.display_meta || {};
    out[name] = {
      title: name,
      desc: dm.desc || `预热 ${m.min_periods} 根`,
      pane: dm.pane === 'main' ? 'main' : 'sub',
      h: 100,
      defaults: m.default_params || {},
      fields: (dm.fields && dm.fields.length) ? dm.fields : [name],
    };
  }
  return out;
}
/* 默认布局（与旧版固定集合一致） */
const IND_LAYOUT_DEFAULT = [
  { type: 'ma',   params: { short: 7, long: 25 } },
  { type: 'boll', params: { period: 20, mult: 2 } },
  { type: 'macd', params: { fast: 12, slow: 26, signal: 9 } },
  { type: 'kd',   params: { n: 9, m: 3 } },
  { type: 'rsi',  params: { period: 14 } },
];
/* 加载 indLayout：新格式直接用；旧格式 indParams（固定键集合）迁移为实例列表 */
let indLayout = [];
if (savedLayout && Array.isArray(savedLayout.indLayout) && savedLayout.indLayout.every(x => IND_CATALOG[x.type] || (x.type === 'custom' && x.name))) {
  indLayout = savedLayout.indLayout.map(x => x.type === 'custom'
    ? { type: 'custom', name: x.name, params: { ...x.params } }
    : { type: x.type, params: { ...IND_CATALOG[x.type].defaults, ...x.params } });
} else {
  indLayout = IND_LAYOUT_DEFAULT.map(x => ({ type: x.type, params: { ...x.params } }));
  if (savedLayout && savedLayout.indParams) {
    for (const it of indLayout) Object.assign(it.params, savedLayout.indParams[it.type] || {});
  }
}
let indSeq = 0;
function nextIndId(type) {
  let id;
  do { id = type + '-' + (++indSeq); } while (document.getElementById('lg-row-' + id));
  return id;
}
function maSeries(klines, period) {
  const out = [];
  for (let i = period - 1; i < klines.length; i++) {
    let s = 0;
    for (let j = i - period + 1; j <= i; j++) s += klines[j].close;
    out.push({ time: klines[i].time, value: s / period });
  }
  return out;
}
function ema(vals, n) {
  const k = 2 / (n + 1); const out = [];
  vals.forEach((v, i) => { out.push(i === 0 ? v : v * k + out[i - 1] * (1 - k)); });
  return out;
}
function macdSeries(klines, fast = 12, slow = 26, signal = 9) {
  const closes = klines.map(k => k.close);
  const e12 = ema(closes, fast), e26 = ema(closes, slow);
  const dif = closes.map((_, i) => e12[i] - e26[i]);
  const dea = ema(dif, signal);
  const hist = [], difS = [], deaS = [];
  klines.forEach((k, i) => {
    difS.push({ time: k.time, value: dif[i] });
    deaS.push({ time: k.time, value: dea[i] });
    hist.push({ time: k.time, value: (dif[i] - dea[i]) * 2, color: histColor(dif[i] - dea[i]) });
  });
  return { difS, deaS, hist };
}
/* BOLL（20,2）：中轨 MA20 ± 2倍标准差 */
function bollSeries(klines, period = 20, mult = 2) {
  const U = [], M = [], L = [];
  for (let i = period - 1; i < klines.length; i++) {
    let s = 0;
    for (let j = i - period + 1; j <= i; j++) s += klines[j].close;
    const mid = s / period;
    let sq = 0;
    for (let j = i - period + 1; j <= i; j++) sq += (klines[j].close - mid) ** 2;
    const sd = Math.sqrt(sq / period);
    U.push({ time: klines[i].time, value: mid + mult * sd });
    M.push({ time: klines[i].time, value: mid });
    L.push({ time: klines[i].time, value: mid - mult * sd });
  }
  return { U, M, L };
}
/* 增量更新用：只算最后一根 bar 的 BOLL（恰好 20 根窗口，结果精确） */
function bollLast(klines, period = 20, mult = 2) {
  const win = Math.min(klines.length, period);
  const r = bollSeries(klines.slice(-win), period, mult);
  return r.U.length ? { u: r.U[r.U.length - 1], m: r.M[r.M.length - 1], l: r.L[r.L.length - 1] } : null;
}
/* KD（随机指标 9,3,3）：RSV 两次 SMA 平滑 */
function kdSeries(klines, n = 9, m = 3) {
  const K = [], D = [];
  let pk = 50, pd = 50;
  klines.forEach((k, i) => {
    const s = Math.max(0, i - n + 1);
    let hh = -Infinity, ll = Infinity;
    for (let j = s; j <= i; j++) { hh = Math.max(hh, klines[j].high); ll = Math.min(ll, klines[j].low); }
    const rsv = hh === ll ? 50 : (k.close - ll) / (hh - ll) * 100;
    pk = (pk * (m - 1) + rsv) / m;
    pd = (pd * (m - 1) + pk) / m;
    K.push({ time: k.time, value: pk });
    D.push({ time: k.time, value: pd });
  });
  return { K, D };
}
/* RSI（14，Wilder 平滑） */
function rsiSeries(klines, period = 14) {
  const out = [];
  let ag = 0, al = 0;
  for (let i = 1; i < klines.length; i++) {
    const ch = klines[i].close - klines[i - 1].close;
    const g = ch > 0 ? ch : 0, l = ch < 0 ? -ch : 0;
    if (i <= period) {
      ag += g / period; al += l / period;
      if (i === period) out.push({ time: klines[i].time, value: al === 0 ? 100 : 100 - 100 / (1 + ag / al) });
    } else {
      ag = (ag * (period - 1) + g) / period;
      al = (al * (period - 1) + l) / period;
      out.push({ time: klines[i].time, value: al === 0 ? 100 : 100 - 100 / (1 + ag / al) });
    }
  }
  return out;
}
/* 增量更新用：只算最后一根 bar 的 KD/RSI（限定预热窗口，避免全量重算） */
function kdLast(klines, n = 9, m = 3) {
  const win = Math.min(klines.length, n * m * 3);
  return kdSeries(klines.slice(-win), n, m);
}
function rsiLast(klines, period = 14) {
  const win = Math.min(klines.length, period * 20);
  return rsiSeries(klines.slice(-win), period);
}

/* ═══ IND-103：MACD 后端统一计算消费（REST 历史序列 + WS 增量；后端不可用时本地兜底） ═══ */
const IND_BACKEND = { macd: 'MACD' };   // 前端 type → 后端注册指标名（本期仅接通 MACD）
function backendParams(inst) {
  const p = inst.params;
  if (inst.type === 'macd') return { fast_period: p.fast, slow_period: p.slow, signal_period: p.signal };
  return { ...p };
}
function macdHistColor(v) { return histColor(v); }
async function fetchIndHistory(inst, gen) {
  const url = `${API}/api/indicator/history?symbol=${curSymbol}&timeframe=${curTf}&exchange=${curExchange}` +
    `&indicator=${IND_BACKEND[inst.type]}&limit=${klines.length}&params=${encodeURIComponent(JSON.stringify(backendParams(inst)))}`;
  const json = await (await fetch(url)).json();
  if (gen !== loadGen || !json.warmed || !json.data || !json.data.length) throw new Error('indicator not ready');
  return json.data;
}
/* WS 指标增量推送：按 (指标名+参数) 匹配实例，更新 series 末点（图例随十字线 seriesData 自动跟随） */
function applyIndPush(msg) {
  if (!initialLoaded) return;
  const parts = msg.topic.split('.');
  if (parts[1] !== curExchange || parts[2] !== curSymbol || parts[3] !== curTf) return;
  for (const item of msg.data || []) {
    for (const inst of indInstances) {
      if (!inst.backend) continue;
      const indName = inst.type === 'custom' ? inst.name : IND_BACKEND[inst.type];
      if (item.indicator !== indName) continue;
      if (JSON.stringify(item.params) !== JSON.stringify(backendParams(inst))) continue;
      const t = Math.floor(item.timestamp / 1000), v = item.values;
      if (inst.type === 'macd') {
        inst.series[0].update({ time: t, value: v.HIST, color: macdHistColor(v.HIST) });
        inst.series[1].update({ time: t, value: v.DIF });
        inst.series[2].update({ time: t, value: v.DEA });
      } else if (inst.type === 'custom') {
        /* IND-110：def 式指标逐字段更新末点，缓存供图例末值显示 */
        inst.fields.forEach((f, i) => {
          if (v[f] == null) return;
          inst.series[i].update({ time: t, value: v[f] });
          (inst.lastVals ||= [])[i] = v[f];
        });
      }
    }
  }
}

const CUSTOM_COLORS = ['#e6c229', '#42a5f5', '#ab47bc', '#26a69a', '#ef5350', '#8d6e63'];   // IND-110 自定义指标字段配色循环

const LINE_BASE = { lineWidth: 1, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false };

function destroyInstance(inst) {

/* 副图窗格清理：移除后变空的 pane 需显式删除（否则残留空白分隔条） */
function cleanupEmptyPanes() {
  const used = new Set([0]);
  indInstances.forEach(i => { if (i.pane > 0) used.add(i.pane); });
  const panes = chart.panes();
  for (let i = panes.length - 1; i >= 1; i--) {
    if (!used.has(i)) { try { chart.removePane(i); } catch (e) {} }
  }

/* 全量重建：销毁全部指标实例后按 indLayout 重建（增删/改参后调用） */
function rebuildIndicators() {
  indInstances.forEach(destroyInstance);
  indInstances = [];
  maColorIdx = 0;
  document.getElementById('lg-main-items').innerHTML = '';
  document.getElementById('ind-legends').innerHTML = '';
  cleanupEmptyPanes();   // 先清理旧空窗格，再建新实例（否则新 pane 索引错位）
  const subPending = [];
  for (const it of indLayout) {
    const inst = buildInstance(it);
    indInstances.push(inst);
    if (inst.pane > 0) subPending.push({ pane: inst.pane, h: catOf(inst).h || 100 });
  }
  /* 新副图窗格应用目标高度（首屏未就绪时留给 applyPaneHeights 统一处理） */
  subPaneTargets = subPending;

  if (klines.length) renderIndData();

/* 副图窗格高度：首屏数据就绪后统一应用。
   注：v5 setHeight 布局异步生效且会把差值按比例分摊给其他窗格，
   同步连续设置会读到旧值/互相干扰 → 逐帧修正误差最大的窗格直至收敛 */
let subPaneTargets = [];   // [{pane, h}] 由 rebuildIndicators 按 indLayout 动态生成
let panesSized = false;
function applyPaneHeights(round = 0) {
  if (round >= 24 || !subPaneTargets.length) return;
  const panes = chart.panes();
  let idx = -1, maxErr = 0;
  for (const t of subPaneTargets) {
    if (t.pane >= panes.length) continue;
    const err = panes[t.pane].getHeight() - t.h;
    if (Math.abs(err) > Math.abs(maxErr)) { maxErr = err; idx = t.pane; }
  }
  if (idx < 0 || Math.abs(maxErr) < 2) return;
  panes[idx].setHeight(panes[idx].getHeight() - maxErr);
  requestAnimationFrame(() => applyPaneHeights(round + 1));   // 等布局生效后再修正下一个
}

/* 副图图例定位：各图例锚定到所属窗格顶部（跟随窗格高度/尺寸/顺序/增删变化） */
function layoutPaneLegends() {
  const panes = chart.panes();

  for (const inst of indInstances) {
    if (inst.pane === 0 || inst.pane >= panes.length) continue;
    const el = inst.legendEl;
    let below = ht;
    for (let j = inst.pane; j < panes.length; j++) below += panes[j].getHeight();   // 含自身窗格高度
    const top = Math.round(container.clientHeight - below + 8);
    if (el.__lastTop !== top) { el.__lastTop = top; el.style.top = top + 'px'; }   // 只在变化时写入，避免频繁样式重算
  }
}

/* ═══ 数据装载（REST 历史 K 线） ═══ */
let klines = [];

let sbInfo = '';             // 状态栏基础信息（装载完成后更新，WS 延迟由定时器每秒拼接刷新）
/* 全量计算单个实例并写入 series；reset=true（切品种/周期）时后端指标立即清空防旧周期残留，
   并返回 apply 闭包由调用方等全部就绪后批量显示（避免逐条跳入的“动画计算”观感） */
function renderInstance(inst, reset = false) {
  const p = inst.params;
  if (inst.type === 'ma') {
    inst.series[0].setData(maSeries(klines, p.short));
    inst.series[1].setData(maSeries(klines, p.long));
  } else if (inst.type === 'boll') {
    const { U, M, L } = bollSeries(klines, p.period, p.mult);
    inst.series[0].setData(U); inst.series[1].setData(M); inst.series[2].setData(L);
  } else if (inst.type === 'macd') {
    /* IND-103：优先消费后端统一计算（REST 历史序列）；失败回退本地计算 */
    const gen = loadGen;
    if (reset) inst.series.forEach(s => s.setData([]));   // 立即清旧周期数据，不残留
    return fetchIndHistory(inst, gen).then(data => {
      if (gen !== loadGen) return null;   // 已切换品种/周期，丢弃陈旧数据
      const difS = [], deaS = [], hist = [];
      data.forEach(d => {
        const time = Math.floor(d.timestamp / 1000);
        difS.push({ time, value: d.values.DIF });
        deaS.push({ time, value: d.values.DEA });
        hist.push({ time, value: d.values.HIST, color: macdHistColor(d.values.HIST) });
      });
      return () => { inst.series[0].setData(hist); inst.series[1].setData(difS); inst.series[2].setData(deaS); inst.backend = true; };
    }).catch(() => {
      if (gen !== loadGen) return null;
      const { difS, deaS, hist } = macdSeries(klines, p.fast, p.slow, p.signal);
      return () => { inst.series[0].setData(hist); inst.series[1].setData(difS); inst.series[2].setData(deaS); inst.backend = false; };
    });
  } else if (inst.type === 'kd') {
    const { K, D } = kdSeries(klines, p.n, p.m);
    inst.series[0].setData(K); inst.series[1].setData(D);
  } else if (inst.type === 'rsi') {
    inst.series[0].setData(rsiSeries(klines, p.period));
  } else if (inst.type === 'custom') {
    /* IND-110：def 式指标统一消费后端计算（REST 历史序列），无本地兜底 */
    const gen = loadGen;
    if (reset) inst.series.forEach(s => s.setData([]));   // 立即清旧周期数据，不残留
    const url = `${API}/api/indicator/history?symbol=${curSymbol}&timeframe=${curTf}&exchange=${curExchange}` +
      `&indicator=${inst.name}&limit=${klines.length}&params=${encodeURIComponent(JSON.stringify(inst.params))}`;
    return fetch(url).then(r => r.json()).then(json => {
      if (gen !== loadGen || !json.warmed || !json.data || !json.data.length) return null;
      const datas = inst.fields.map(() => []);
      json.data.forEach(d => {
        const time = Math.floor(d.timestamp / 1000);
        inst.fields.forEach((f, i) => {
          const v = d.values[f];
          if (v != null) datas[i].push({ time, value: v });
        });
      });
      return () => {
        datas.forEach((s, i) => inst.series[i].setData(s));
        inst.lastVals = datas.map(s => s.length ? s[s.length - 1].value : null);
      };
    }).catch(() => null);   // 后端未连时保持占位（已清空）
  }
  return null;
}
/* 批量渲染：后端指标实例全部就绪后一次性显示（本地指标同步即出） */
function renderIndData(reset = false) {
  const applies = [];
  for (const inst of indInstances) {
    const pr = renderInstance(inst, reset);
    if (pr) applies.push(pr);
  }
  if (applies.length) Promise.all(applies).then(fns => fns.forEach(fn => fn && fn()));
}
function renderChart(reset = false) {
  candleSeries.setData(klines.map(k => ({ time: k.time, open: k.open, high: k.high, low: k.low, close: k.close })));
  volumeSeries.setData(klines.map(k => ({ time: k.time, value: k.volume, color: volColor(k.close, k.open) })));
  renderIndData(reset);
}
/* 切换涨跌配色（全局生效）：交换 CSS 变量 + K 线系列改色 + 全量重绘 */
function applyColorScheme(scheme, persist = true) {
  if (!COLOR_SCHEMES[scheme]) return;
  colorScheme = scheme; CS = COLOR_SCHEMES[scheme];
  applySchemeVars();
  candleSeries.applyOptions({
    upColor: CS.up, downColor: CS.down,
    borderUpColor: CS.up, borderDownColor: CS.down,
    wickUpColor: CS.up, wickDownColor: CS.down,
  });
  renderChart();   // 成交量/MACD 等按新方案重绘
  const sel = document.getElementById('ctx-scheme');
  if (sel) sel.value = scheme;
  if (persist) { try { localStorage.setItem('kq-color-scheme', scheme); } catch (e) {} }
}
/* 拉取一页 K 线（endTime 可选，往前翻页用）；同时携带后端下发的价格精度 */
async function fetchPage(need, endTime) {
  const url = `${API}/api/market/klines?symbol=${curSymbol}&timeframe=${curTf}&limit=${need}&exchange=${curExchange}${endTime ? `&end_time=${endTime}` : ''}`;
  const resp = await fetch(url);
  const json = await resp.json();
  return {
    bars: (json.data || []).map(k => ({
      time: Math.floor(k.timestamp / 1000),
      open: k.open, high: k.high, low: k.low, close: k.close, volume: k.volume,
    })),
    precision: json.price_precision || 0,   // 品种精度由后端从订阅价格推导，前端只渲染
  };
}
/* 显示精度兜底：仅在后端未下发 price_precision 时使用（取样 OHLC 最大小数位，上限 8、保底 1） */
function detectPrecision(bars) {
  let maxD = 0;
  for (const k of bars.slice(-120)) {
    for (const v of [k.open, k.high, k.low, k.close]) {
      const s = typeof v === 'number' ? String(v) : (v == null ? '' : String(+v));
      const i = s.indexOf('.');
      if (i >= 0) maxD = Math.max(maxD, Math.min(8, s.length - i - 1));
    }
    if (maxD >= 8) break;
  }
  return Math.max(1, maxD);
}
async function load() {
  loadGen++;                // 作废进行中的翻页请求
  initialLoaded = false;    // 重新拉取期间暂不接收 WS bar
  setSb(`◉ 拉取 ${curSymbol} ${curTf} K 线…`);
  noMoreData = false;
  try {
    /* 首屏只拉 INIT_BARS 根，翻屏时再懒加载更早数据 */
    const need = Math.min(INIT_BARS, klineCount);
    const firstPage = await fetchPage(need, null);
    klines = firstPage.bars;
    if (!klines.length) { setSb('✕ 未返回 K 线数据'); return; }
    if (klines.length < need) noMoreData = true;
    /* Y 轴/十字线精度：消费后端按订阅价格推导的精度（前端只渲染不推导），
       后端未下发时才本地兜底 */
    const prec = firstPage.precision > 0 ? firstPage.precision : detectPrecision(klines);
    curPrec = prec;   // 图例 fmt 与坐标轴同精度
    symbolPrec[curSymbol] = prec;   // 记录当前品种精度（供持仓表/品种列表按品种渲染）
    candleSeries.applyOptions({ priceFormat: { type: 'price', precision: prec, minMove: +(10 ** -prec).toFixed(8) } });
    const lvr = chart.timeScale().getVisibleLogicalRange();   // 重置前记录视窗（切品种/周期后保持缩放比例）
    const span = lvr ? lvr.to - lvr.from : null;
    renderChart(true);
    if (!panesSized) { panesSized = true; setTimeout(applyPaneHeights, 200); }   // 首屏就绪后应用副图高度（等 autoSize 布局稳定）
    const isFirst = firstFit;
    if (isFirst) { firstFit = false; chart.timeScale().fitContent(); }   // 首屏铺满；此后切换保持原比例 + 最新 K 线右对齐
    initialLoaded = true;   // 首屏就绪，开始接收 WS 增量
    if (!isFirst && span) {   // 非首屏：显示根数不变（即缩放比例不变），最新 K 线对齐右侧留白
      const to = klines.length - 1 + curRightOffset;
      chart.timeScale().setVisibleLogicalRange({ from: to - span, to });
    }
    lastPrices[curSymbol] = klines[klines.length - 1].close;
    updateTicker(klines[klines.length - 1].close);
    sbInfo = (sourcesMeta[curExchange] && sourcesMeta[curExchange].label) || curExchange;
    renderStatusbar();
  } catch (e) {
    console.error('load failed:', e);   // 暴露真实错误，避免被兜底文案掩盖
    setSb('✕ 后端未连接（127.0.0.1:8000），请先启动 API Gateway');
  }
}

/* ═══ 懒加载翻页：左滑接近边界时加载更早 K 线 ═══ */
let loadingMore = false;
let noMoreData = false;
let loadGen = 0;   // 加载代次：切换品种/周期/重载时作废进行中的翻页
let firstFit = true;   // 首屏标记：仅首次加载 fitContent 铺满，此后切换保持原缩放比例
async function loadMore() {
  if (loadingMore || noMoreData || klines.length >= klineCount) return;
  loadingMore = true;
  const gen = loadGen, sym = curSymbol, tf = curTf;
  const anchorTime = klines[0].time;   // 数据锚点：完成后校验数据未被重置
  setSb(`◉ 加载更早 K 线… ${klines.length}/${klineCount}`);
  try {
    const need = Math.min(PAGE_SIZE, klineCount - klines.length);
    let page = (await fetchPage(need, anchorTime * 1000 - 1)).bars;
    if (gen !== loadGen || sym !== curSymbol || tf !== curTf) return;   // 已切换，丢弃旧数据防混入
    if (!klines.length || klines[0].time !== anchorTime) return;        // 数据已重置，丢弃
    page = page.filter(k => k.time < anchorTime);                       // 防时间戳重叠
    if (!page.length) {                                                 // 无更早数据
      noMoreData = true;
      return;
    }
    if (page.length < need) noMoreData = true;
    /* 逻辑坐标平移补偿：prepend N 根后索引整体 +N，视窗锁定原时间窗口不跳动 */
    const lvr = chart.timeScale().getVisibleLogicalRange();
    klines = page.concat(klines);
    renderChart();
    if (lvr) chart.timeScale().setVisibleLogicalRange({ from: lvr.from + page.length, to: lvr.to + page.length });
  } catch (e) {
    setSb('✕ 加载更早 K 线失败');
  } finally {
    loadingMore = false;
  }
}
chart.timeScale().subscribeVisibleLogicalRangeChange(range => {
  if (!range || !initialLoaded || klines.length < 10 || loadingMore || noMoreData || klines.length >= klineCount) return;
  const span = range.to - range.from;
  const fullyVisible = span >= klines.length - 1;
  if (range.from < 10 && (!fullyVisible || range.from < -1)) loadMore();
});

  for (const f of meta.fields) {
    const el = document.getElementById('ind-f-' + f.key);
    let v = parseFloat(el.value);
    if (!isFinite(v)) { el.focus(); return; }
    v = Math.min(fieldMax(f), Math.max(f.min, v));
    next[f.key] = f.step && f.step < 1 ? +v.toFixed(1) : Math.round(v);
  }
  if (inst.type === 'macd' && next.fast >= next.slow) {
    document.getElementById('ind-f-fast').focus();
    return;   // 快线必须小于慢线
  }
  /* 回写 indLayout 同源条目，重建实例（series 颜色/图例标签同步） */
  const li = indLayout.findIndex(x => x === layoutRef(inst));
  if (li >= 0) indLayout[li].params = next; else inst.params = { ...next };

/* 实例 ↔ indLayout 条目映射（重建后实例重新生成，按顺序+类型定位） */
function layoutRef(inst) {
  if (inst.type === 'custom') {
    /* IND-110：custom 条目按 (type+name) 定位 */
    let nth = -1;
    for (const i of indInstances) {
      if (i.type === 'custom' && i.name === inst.name) nth++;
      if (i === inst) break;
    }
    let cnt = -1;
    for (const x of indLayout) {
      if (x.type === 'custom' && x.name === inst.name) cnt++;
      if (cnt === nth) return x;
    }
    return null;
  }
  let nth = -1;
  for (const i of indInstances) {
    if (i.type === inst.type) nth++;
    if (i === inst) break;
  }
  let cnt = -1;
  for (const x of indLayout) {
    if (x.type === inst.type) cnt++;
    if (cnt === nth) return x;
  }
  return null;
}

/* ═══ 十字光标图例 ═══ */
/* 价格格式化：与坐标轴同一推导精度（load 时从实际价格小数位检测，curPrec 同步） */
let curPrec = 2;
const fmt = v => v.toLocaleString('en-US', { minimumFractionDigits: curPrec, maximumFractionDigits: curPrec });
/* 悬停图例行期间冻结文本更新：防止数值变化→行宽变化→齿轮位移→鼠标落回图表→十字线再触发的抖动循环 */
let legendFrozen = false, legendDirty = false;
document.querySelectorAll('.legend-row').forEach(row => {
  row.addEventListener('pointerenter', () => { legendFrozen = true; });
  row.addEventListener('pointerleave', () => { legendFrozen = false; if (legendDirty) { legendDirty = false; refreshLegend(); } });
});
/* 定向更新单个 span（禁止 innerHTML 重建整行：重建会导致行宽/齿轮位置抖动 → 悬停闪烁） */
function setLg(id, text, cls) {
  const el = document.getElementById(id);
  if (el.textContent !== text) el.textContent = text;
  if (cls && el.dataset.c !== cls) { el.dataset.c = cls; el.className = cls; }
}
let lastCross = null;   // 最近一次十字线参数（冻结期结束后补刷新）
function refreshLegend() {
  const param = lastCross;
  let bar;
  const vals = new Map();   // series → 十字线取值
  if (param && param.time && param.seriesData) {
    const c = param.seriesData.get(candleSeries);
    if (c) bar = c;
    for (const inst of indInstances) for (const s of inst.series) {
      const d = param.seriesData.get(s);
      if (d) vals.set(s, d.value);
    }
  }
  const last = bar ?? klines[klines.length - 1];
  if (!last) return;
  const cls = last.close >= last.open ? 'up' : 'down';
  setLg('lg-o', fmt(last.open), cls);
  setLg('lg-h', fmt(last.high), cls);
  setLg('lg-l', fmt(last.low), cls);
  setLg('lg-c', fmt(last.close), cls);
  setLg('lg-vol', 'VOL: ' + (last.volume ? last.volume.toFixed(1) : '--'));
  /* 各指标实例：十字线取值优先，无十字线时用末根 bar 现算 */
  for (const inst of indInstances) {
    const lv = inst.legendVals, keys = Object.keys(lv);
    if (param && param.time) {
      inst.series.forEach((s, i) => {
        if (i >= keys.length) return;
        const v = vals.get(s);
        const el = lv[keys[i]];
        const txt = v != null ? fmt(v) : '--';
        if (el.textContent !== txt) el.textContent = txt;
      });
    } else {
      const lastVals = calcLastVals(inst);
      keys.forEach((k, i) => {
        const v = lastVals[i];
        const txt = v != null ? fmt(v) : '--';
        if (lv[k].textContent !== txt) lv[k].textContent = txt;
      });
    }
  }
}
/* 末根 bar 各图例分量现算（顺序与 buildInstance 的 parts 一致） */
function calcLastVals(inst) {
  const p = inst.params;
  if (inst.type === 'custom') return inst.lastVals || inst.fields.map(() => null);   // IND-110：后端驱动，取缓存末值
  if (inst.type === 'ma') {
    const f = klines.length >= p.short ? maSeries(klines.slice(-p.short), p.short)[0]?.value : null;
    const l = klines.length >= p.long ? maSeries(klines.slice(-p.long), p.long)[0]?.value : null;
    return [f, l];
  }
  if (inst.type === 'boll') {
    const r = klines.length >= p.period ? bollLast(klines, p.period, p.mult) : null;
    return r ? [r.u.value, r.m.value, r.l.value] : [null, null, null];
  }
  if (inst.type === 'macd') {
    const { difS, deaS, hist } = macdSeries(klines, p.fast, p.slow, p.signal);
    return [hist[hist.length - 1]?.value ?? null, difS[difS.length - 1]?.value ?? null, deaS[deaS.length - 1]?.value ?? null];
  }
  if (inst.type === 'kd') {
    const r = kdLast(klines, p.n, p.m);
    return [r.K[r.K.length - 1]?.value ?? null, r.D[r.D.length - 1]?.value ?? null];
  }
  if (inst.type === 'rsi') {
    const r = rsiLast(klines, p.period);
    return [r[r.length - 1]?.value ?? null];
  }
  return [];
}
chart.subscribeCrosshairMove(param => {
  lastCross = param;
  if (legendFrozen) { legendDirty = true; return; }
  refreshLegend();
});

/* ═══ WS 实时推送（增量 update + 心跳看门狗：静默超时强制重连并重新订阅） ═══ */
let ws = null;
let wsLastMsgAt = Date.now();   // 最近一次收到任意 WS 消息的时间
let wsLatency = null;           // 最新端到端延迟（ms）= Date.now() - 行情事件时间 event_ms
let wsLatencyAt = 0;            // wsLatency 的刷新时刻（超 10s 未刷新视为无数据）
const posPriceTopics = new Set();   // 持仓品种价格订阅主题（与图表同频）
const listPriceTopics = new Set();   // 品种列表价格订阅主题（与图表同源同频，替代 REST 轮询）
function setWs(ok) {
  document.getElementById('ws-status').textContent = ok ? 'WS 已连接' : 'WS 断开 · 重连中';
  document.querySelector('.dot').style.background = ok ? '#0ecb81' : '#f6465d';   // 连接状态色固定，不随涨跌方案交换
}
function subscribeWS() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ action: 'subscribe', topic: `klines.${curExchange}.${curSymbol}.${curTf}` }));
    ws.send(JSON.stringify({ action: 'subscribe', topic: `indicators.${curExchange}.${curSymbol}.${curTf}` }));
  }
}
/* 品种列表价格改走 WS（与图表同源同频）：按当前所列表品种差量订阅/退订 1m 主题 */
function resyncListTopics() {
  if (!ws || ws.readyState !== WebSocket.OPEN) return;
  const want = new Set();
  symGroups.forEach(g => g.symbols.forEach(s => { if (s.sym) want.add(`klines.${curExchange}.${s.sym}.1m`); }));
  for (const t of [...listPriceTopics]) if (!want.has(t)) {
    ws.send(JSON.stringify({ action: 'unsubscribe', topic: t }));
    listPriceTopics.delete(t);
  }
  for (const t of want) if (!listPriceTopics.has(t)) {
    ws.send(JSON.stringify({ action: 'subscribe', topic: t }));
    listPriceTopics.add(t);
  }
}
/* 品种列表单行价格实时更新（定点改 DOM，不重建列表） */
function updateListPrice(sym, price) {
  let entry = null;
  for (const g of symGroups) { entry = g.symbols.find(s => s.sym === sym); if (entry) break; }
  if (!entry) return;
  const prev = entry.price;
  entry.price = price;
  lastPrices[sym] = price;
  const el = document.querySelector(`.wl-row[data-sym="${entry.name}"] .wl-val`);
  if (el) {
    el.textContent = fmtSym(sym, price);
    if (prev != null && price !== prev) el.className = 'wl-val ' + (price > prev ? 'up' : 'down');
  }
}
function connectWS() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {
      wsLastMsgAt = Date.now();
      setWs(true); subscribeWS();
      posPriceTopics.forEach(t => ws.send(JSON.stringify({ action: 'subscribe', topic: t })));
      listPriceTopics.clear(); resyncListTopics();   // 重连后服务端订阅已丢，全量重建
    };
    ws.onmessage = ev => {
      wsLastMsgAt = Date.now();
      const msg = JSON.parse(ev.data);
      if (msg.action === 'pong' || msg.action === 'subscribed') return;   // 心跳/订阅回执
      if (!msg.topic || !msg.data) return;
      if (msg.topic.startsWith('indicators.')) { applyIndPush(msg); return; }   // IND-103：后端指标增量推送
      if (!msg.topic.startsWith('klines.')) return;
      if (msg.data.exchange && msg.data.exchange !== curExchange) return;   // 跨所串数据防护
      if (msg.data.event_ms) {   // 端到端延迟：币安事件时间 → 前端接收
        wsLatency = Math.max(0, Date.now() - msg.data.event_ms);
        wsLatencyAt = Date.now();
      }
      const parts = msg.topic.split('.');
      // 品种列表价格订阅：与图表同源同频更新（不 return，当前品种 1m 时图表链路继续处理）
      if (listPriceTopics.has(msg.topic)) updateListPrice(parts[parts.length - 2], msg.data.close);
      // 持仓品种价格订阅：更新频率与图表保持一致
      if (posPriceTopics.has(msg.topic)) {
        lastPrices[parts[parts.length - 2]] = msg.data.close;
        renderPositions();
        return;
      }
      if (parts[parts.length - 2] !== curSymbol || (parts[parts.length - 1] || '') !== curTf) return;   // 只收当前品种+周期
      applyBar(msg.data);
    };
    ws.onclose = () => { setWs(false); setTimeout(connectWS, 3000); };
    ws.onerror = () => ws.close();
  } catch (e) { setWs(false); }
}
/* 心跳看门狗：每 10s 发 ping（后端回 pong 兼作保活）；35s 无任何消息 →
   判定僵尸连接/订阅丢失（TCP 半开时 onclose 不触发），强制重连并重新订阅 */
setInterval(() => {
  if (!ws) { connectWS(); return; }
  if (ws.readyState === WebSocket.OPEN) {
    if (Date.now() - wsLastMsgAt > 35000) { try { ws.close(); } catch (e) {} return; }
    try { ws.send(JSON.stringify({ action: 'ping' })); } catch (e) {}
  }
}, 10000);

/* 状态栏：基础信息 + 信号图标 + 实时延迟，每秒刷新（直观反映链路状态） */
function sigSvg(level, color) {
  /* 4 格信号图标：level 0~4 为点亮格数，未点亮格用边框灰 */
  const hs = [4, 7, 10, 13];
  const bars = hs.map((h, i) =>
    `<rect x="${i * 4}" y="${14 - h}" width="2.5" height="${h}" rx="0.8" fill="${i < level ? color : 'var(--border)'}"/>`).join('');
  return `<svg width="15" height="14" viewBox="0 0 14 14" style="vertical-align:-2px">${bars}</svg>`;
}
function renderStatusbar() {
  if (!initialLoaded || loadingMore || !sbInfo) return;
  let icon, label;
  if (wsLatency !== null && Date.now() - wsLatencyAt < 10000) {
    const lv = wsLatency < 500 ? 4 : wsLatency < 1200 ? 3 : wsLatency < 2500 ? 2 : 1;
    const col = lv >= 3 ? '#0ecb81' : lv === 2 ? '#e0a63f' : '#f6465d';   // 链路状态色固定，不随涨跌方案交换
    icon = sigSvg(lv, col); label = `${wsLatency}ms`;
  } else if (ws && ws.readyState === WebSocket.OPEN) {
    icon = sigSvg(1, 'var(--text-sub)'); label = '等待数据';
  } else {
    icon = sigSvg(0, 'var(--down)'); label = '断开';
  }
  document.getElementById('sb-status').innerHTML = `◉ ${sbInfo} · ${icon} ${label}`;
}
setInterval(renderStatusbar, 1000);

/* 收到实时 bar：增量更新图表与指标 */
function applyBar(b) {
  if (!initialLoaded || !klines.length) return;   // 首屏未就绪：忽略 WS 推送，防空图竞态
  const t = Math.floor(b.timestamp / 1000);
  const bar = { time: t, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume };
  const last = klines[klines.length - 1];
  if (last && t === last.time) klines[klines.length - 1] = bar;
  else if (!last || t > last.time) { klines.push(bar); if (klines.length > klineCount) klines.shift(); }
  else return;
  candleSeries.update(bar);
  volumeSeries.update({ time: t, value: bar.volume, color: volColor(bar.close, bar.open) });
  indInstances.forEach(inst => updateInstanceLast(inst, t));
  lastPrices[curSymbol] = bar.close;
  updateTicker(bar.close);
  renderPositions();
}
/* 单实例增量更新：只算末根 bar（限定预热窗口，避免全量重算） */
function updateInstanceLast(inst, t) {
  if (inst.type === 'custom') return;   // IND-110：def 式指标末根由后端 indicators.* WS 推送
  const p = inst.params, n = klines.length;
  if (inst.type === 'ma') {
    if (n >= p.short) inst.series[0].update({ time: t, value: maSeries(klines.slice(-p.short), p.short)[0].value });
    if (n >= p.long) inst.series[1].update({ time: t, value: maSeries(klines.slice(-p.long), p.long)[0].value });
  } else if (inst.type === 'boll') {
    if (n >= p.period) {
      const bu = bollLast(klines, p.period, p.mult);
      inst.series[0].update(bu.u); inst.series[1].update(bu.m); inst.series[2].update(bu.l);
    }
  } else if (inst.type === 'macd') {
    if (inst.backend) return;   // IND-103：后端驱动实例的末点由 indicators.* WS 推送，仅本地兜底时自算
    const { difS, deaS, hist } = macdSeries(klines, p.fast, p.slow, p.signal);
    inst.series[0].update(hist[hist.length - 1]); inst.series[1].update(difS[difS.length - 1]); inst.series[2].update(deaS[deaS.length - 1]);
  } else if (inst.type === 'kd') {
    const r = kdLast(klines, p.n, p.m);
    if (r.K.length) inst.series[0].update(r.K[r.K.length - 1]);
    if (r.D.length) inst.series[1].update(r.D[r.D.length - 1]);
  } else if (inst.type === 'rsi') {
    const r = rsiLast(klines, p.period);
    if (r.length) inst.series[0].update(r[r.length - 1]);
  }
}

function updateTicker(price) {
  const el = document.getElementById('tk-price');
  const prev = parseFloat(el.textContent.replace(/,/g, '')) || price;
  el.textContent = fmt(price);
  el.className = 'ticker-value ' + (price >= prev ? 'up' : 'down');
}

/* ═══ REST 轮询：24h 行情 / 持仓与账户（品种列表价格已改走 WS，ticker 仅作涨跌幅兜底） ═══ */
async function fetchTopTicker() {
  try {
    const t = await (await fetch(`${API}/api/market/ticker?symbol=${curSymbol}&exchange=${curExchange}`)).json();
    if (t.last_price > 0) {
            if (t.price_precision) symbolPrec[curSymbol] = t.price_precision;   // 后端下发的品种精度

      });

}

let posList = [];
async function fetchPositions() {
  try {
    const [p, a] = await Promise.all([
      fetch(`${API}/api/trade/positions`).then(r => r.json()),
      fetch(`${API}/api/trade/account`).then(r => r.json()),

    posList = p.positions || [];
    // 持仓品种实时价格：WS 订阅（更新频率与图表 500ms 一致）

      posList.forEach(p => {
        const topic = `klines.${p.symbol}.1m`;
        if (p.symbol !== curSymbol && !posPriceTopics.has(topic)) {
          posPriceTopics.add(topic);
          ws.send(JSON.stringify({ action: 'subscribe', topic }));
        }
      });
    }
    if (typeof a.available_balance === 'number') {
      document.getElementById('avail-bal').textContent = `可用 ${a.available_balance.toFixed(2)} USDT`;

function renderPositions() {
  document.getElementById('pos-cnt').textContent = posList.length;

  if (!posList.length) {

      <td class="muted">--</td><td class="muted">--</td><td class="muted">--</td>

}

async function refreshListPrices() {
  const targets = [];
  symGroups.forEach(g => g.symbols.forEach(s => { if (s.sym) targets.push(s); }));
  await Promise.all(targets.map(async s => {
    try {
      const t = await (await fetch(`${API}/api/market/ticker?symbol=${s.sym}&exchange=${curExchange}`)).json();
      if (t.last_price > 0) {
        s.price = t.last_price;
        s.chg = (t.price_change_pct >= 0 ? '+' : '') + t.price_change_pct.toFixed(2) + '%';
        lastPrices[s.sym] = t.last_price;
        if (t.price_precision) symbolPrec[s.sym] = t.price_precision;   // 后端下发的品种精度
      }
    } catch (e) {}
  }));
  renderSymbols();
  renderPositions();
}

/* ═══ 市场映射（内部路由标识 -> 市场名；阶段二迁至后端路由表）：市场固定，一市场绑定唯一数据源 ═══ */
const MARKET_NAMES = { crypto: '加密', fx: '外汇', stock: '股票', future: '期货' };
const MARKET_OF_EX = { binance: 'crypto', mt5: 'fx', ig: 'fx' };

/* 顶栏 SPOT 标签 -> 当前市场名（不再展示数据源名称） */
function updateTopTag() {
  const el = document.getElementById('top-tag');
  if (el) el.textContent = MARKET_NAMES[MARKET_OF_EX[curExchange]] || 'SPOT';
}
function updateModeBadge() { updateTopTag(); }

/* ═══ 品种列表：分组 + 删除（分组按市场隔离，切换市场时整组替换） ═══ */
const ICO_COLORS = ['#f7931a','#627eea','#f0b90b','#00ffa3','#c2a633','#e84142','#8e44ad','#2980b9'];
const DEFAULT_BINANCE_GROUPS = [
  { name: '加密货币', collapsed: false, symbols: [
    { name: 'BTC/USDT', sym: 'BTCUSDT', price: null, chg: '--' },
    { name: 'ETH/USDT', sym: 'ETHUSDT', price: null, chg: '--' },
    { name: 'BNB/USDT', sym: 'BNBUSDT', price: null, chg: '--' },
    { name: 'SOL/USDT', sym: 'SOLUSDT', price: null, chg: '--' },
    { name: 'XRP/USDT', sym: 'XRPUSDT', price: null, chg: '--' },
    { name: 'DOGE/USDT', sym: 'DOGEUSDT', price: null, chg: '--' },
  ]},
  { name: '全球指数（示例）', collapsed: false, symbols: [
    { name: 'SPX500', price: 7599.5, chg: '+1.55%' },
    { name: 'NAS100', price: 27842.1, chg: '+0.69%' },
  ]},
  { name: '外汇与商品（示例）', collapsed: false, symbols: [
    { name: 'XAUUSD 黄金', price: 4210.80, chg: '+0.29%' },
    { name: 'USD/CNY', price: 7.1420, chg: '-0.12%' },
  ]},
];
const symGroupsByEx = {};   // exchange -> 该所品种分组（用户增删后保留）
function groupsFor(ex) {
  if (!symGroupsByEx[ex]) {
    if (ex === 'binance') {
      symGroupsByEx[ex] = DEFAULT_BINANCE_GROUPS;
    } else {
      /* 非币安所：默认分组由后端插件元数据（default_symbols）生成；
         元数据未加载（localStorage 恢复 exchange 早于 initSources）时返回临时空组，不写入缓存 */
      const m = sourcesMeta[ex];
      if (!m) return [];
      /* 分组名为市场分类（加密/外汇…），与数据源名称无关 */
      symGroupsByEx[ex] = [{ name: MARKET_NAMES[MARKET_OF_EX[ex]] || (m && m.label) || ex, collapsed: false,
        symbols: ((m && m.default_symbols) || []).map(s => ({ name: s.name, sym: s.symbol, price: null, chg: '--' })) }];
    }
  }
  return symGroupsByEx[ex];
}
let symGroups = groupsFor(curExchange);
let symFilter = '';

function switchExchange(ex, opts = {}) {
  const meta = sourcesMeta[ex];
  if (!meta) return;
  curExchange = ex;
  symGroups = groupsFor(ex);
  /* 品种：opts.symbol 指定时（品种搜索弹窗选中）直接采用；否则当前品种不属于新所时切到该所默认首个品种 */
  const belongs = symGroups.some(g => g.symbols.some(s => s.sym && s.sym === curSymbol));
  if (opts.symbol) {
    curSymbol = opts.symbol;
    document.getElementById('top-symbol').textContent = curSymbol;
    document.querySelector('.watermark').textContent = curSymbol;
  } else if (!opts.keepSymbol && !belongs && meta.default_symbols.length) {
    curSymbol = meta.default_symbols[0].symbol;
    document.getElementById('top-symbol').textContent = curSymbol;
    document.querySelector('.watermark').textContent = curSymbol;
  }
  /* 周期：该所不支持当前周期时切到首个支持项 */
  if (meta.timeframes && meta.timeframes.length && !meta.timeframes.includes(curTf)) {
    curTf = meta.timeframes[0];
    document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.dataset.tf === curTf));
  }
  applyTfAvailability();
  applyVolVisibility();
  renderSymbols();
  resyncListTopics();   // 切所：退订旧所列表品种、订阅新所
  updateModeBadge();
  load();
  subscribeWS();
  fetchTopTicker();
  refreshListPrices();
  saveLayout();
}
/* 周期按钮可用性：插件不支持的周期置灰禁点 */
function applyTfAvailability() {
  const m = sourcesMeta[curExchange];
  document.querySelectorAll('.tf-btn').forEach(b => {
    const ok = !m || !m.timeframes.length || m.timeframes.includes(b.dataset.tf);
    b.disabled = !ok;
  });

/* 启动时拉取后端已注册市场源插件（前端交易所选择器数据源） */
async function initSources() {
  try {
    const j = await (await fetch(`${API}/api/market/sources`)).json();
    (j.sources || []).forEach(s => { sourcesMeta[s.exchange] = s; });
  } catch (e) {}
  if (!sourcesMeta[curExchange]) curExchange = Object.keys(sourcesMeta)[0] || 'binance';
  /* 解析期可能已生成无品种的占位分组（元数据未就绪），重建以填充默认品种；
     已有用户品种的缓存不动，保留用户增删 */
  const cached = symGroupsByEx[curExchange];
  if (curExchange !== 'binance' && cached && !cached.some(g => g.symbols.some(s => s.sym))) {
    delete symGroupsByEx[curExchange];
  }
  symGroups = groupsFor(curExchange);
  /* 恢复的品种不属于当前所（如 exchange=ig 但 symbol=BTCUSDT）：回退到该所默认首个品种 */
  const meta = sourcesMeta[curExchange];
  const belongs = symGroups.some(g => g.symbols.some(s => s.sym && s.sym === curSymbol));
  if (!belongs && meta && meta.default_symbols && meta.default_symbols.length) {
    curSymbol = meta.default_symbols[0].symbol;
    const topSym = document.getElementById('top-symbol');
    if (topSym) topSym.textContent = curSymbol;
    const wm = document.querySelector('.watermark');
    if (wm) wm.textContent = curSymbol;
    saveLayout();   // 回退结果写回持久化，避免每次刷新重复纠正
  }
  renderSymbols();
  applyTfAvailability();
  resyncListTopics();   // 首屏：列表品种 WS 订阅（WS 未就绪时由 onopen 补建）
}

function icoFor(name) {
  let h = 0;
  for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return ICO_COLORS[h % ICO_COLORS.length];
}

function renderSymbols() {
  const root = document.getElementById('sym-list');
  const kw = symFilter.trim().toLowerCase();
  let html = '';
  symGroups.forEach((g, gi) => {
    const list = kw ? g.symbols.filter(s => s.name.toLowerCase().includes(kw)) : g.symbols;
    html += `<div class="wl-group-head ${g.collapsed && !kw ? 'collapsed' : ''}" data-g="${gi}">
      <span class="caret">▼</span><span>${g.name}</span><span class="cnt">${list.length}</span></div>`;
    if (g.collapsed && !kw) return;
    list.forEach(s => {
      const isUp = (s.chg || '').startsWith('+');
      const chgCls = s.chg === '--' ? 'muted' : (isUp ? 'up' : 'down');
      /* 无订阅品种（静态示例数据）：按数据自身小数位渲染，不受当前图精度污染 */
      const priceTxt = typeof s.price === 'number'
        ? (s.sym ? fmtSym(s.sym, s.price) : s.price.toLocaleString('en-US', { minimumFractionDigits: (String(s.price).split('.')[1] || '').length }))
        : '--';
      const activeCls = s.sym && s.sym === curSymbol ? ' active' : '';
      html += `<div class="wl-row${activeCls}" data-sym="${s.name}">
        <span class="wl-ico" style="background:${icoFor(s.name)}">${s.name[0].toUpperCase()}</span>
        <span class="wl-name">${s.name}</span>
        <span class="wl-val">${priceTxt}</span>
        <span class="wl-chg ${chgCls}">${s.chg}</span>
        <span class="wl-del" data-del="${gi}|${s.name}" title="删除">✕</span>
      </div>`;
    });
  });
  root.innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-sub);font-size:12px">无匹配品种</div>';
}

document.getElementById('sym-list').addEventListener('click', e => {
  const del = e.target.closest('[data-del]');
  if (del) {
    const [gi, name] = del.dataset.del.split('|');
    const g = symGroups[+gi];
    g.symbols = g.symbols.filter(s => s.name !== name);
    if (!g.symbols.length) symGroups.splice(+gi, 1);
    renderSymbols();
    resyncListTopics();
    return;
  }
  const head = e.target.closest('.wl-group-head');
  if (head) {
    symGroups[+head.dataset.g].collapsed = !symGroups[+head.dataset.g].collapsed;
    renderSymbols();
    return;
  }
  // 点击品种行 → 切换图表品种（真实数据）
  const row = e.target.closest('.wl-row');
  if (row) {
    const s = symGroups.flatMap(g => g.symbols).find(x => x.name === row.dataset.sym);
    if (s && s.sym) switchSymbol(s.sym);
  }
});

document.getElementById('sym-filter').addEventListener('input', e => {
  symFilter = e.target.value;
  renderSymbols();
});

/* 右栏 ＋ -> 品种搜索弹窗（品种全部由后端提供，手动添加已移除） */
document.getElementById('add-sym').addEventListener('click', openSymSearch);

renderSymbols();

/* ═══ 品种搜索弹窗（TradingView 式：后端全量品种目录 + 资产类别筛选 + 数据源名标注） ═══ */
let srType = 'all', srRegion = 'global', srKw = '';
let srFull = null;            // 全量品种目录（后端 /api/market/symbols，含全部数据源）；null=未拉取
const srModal = document.getElementById('sr-modal');
const SR_RENDER_CAP = 200;    // 单次渲染上限（品种数千级，先筛选后渲染）
/* 资产类别 pill 固定顺序（仅展示数据中实际存在的类别） */
const TYPE_ORDER = ['crypto', 'forex', 'metal', 'index', 'commodity', 'stock', 'bond'];
const TYPE_NAMES = { crypto: '加密', forex: '外汇', metal: '贵金属', index: '指数', commodity: '商品', stock: '股票', bond: '债券' };

async function loadSrFull() {
  if (srFull) return;
  try {
    const d = await (await fetch('/api/market/symbols')).json();
    srFull = d.symbols || [];
  } catch (e) {
    /* 后端未连接：回退源元数据默认品种，保证弹窗可用 */
    srFull = Object.entries(sourcesMeta).flatMap(([ex, m]) =>
      ((m && m.default_symbols) || []).map(s => ({ exchange: ex, source: m.label, symbol: s.symbol, name: s.name, type: s.type || '' })));
  }
}
function renderSrTabs() {
  const present = new Set((srFull || []).map(r => r.type).filter(Boolean));
  const pills = [{ key: 'all', name: '全部' }].concat(
    TYPE_ORDER.filter(t => present.has(t)).map(t => ({ key: t, name: TYPE_NAMES[t] })));
  document.getElementById('sr-tabs').innerHTML = pills.map(t =>
    `<button class="mkt-pill${t.key === srType ? ' active' : ''}" data-tp="${t.key}">${t.name}</button>`).join('');
}
function renderSrFilter() {
  document.getElementById('sr-filter').innerHTML = `<div class="region-seg">
      <button class="region-btn${srRegion === 'global' ? ' active' : ''}" data-rg="global">国外</button>
      <button class="region-btn${srRegion === 'cn' ? ' active' : ''}" data-rg="cn">国内</button>
    </div>`;
}
function renderSrResults() {
  const body = document.getElementById('sr-body');
  if (srRegion === 'cn') { body.innerHTML = '<div class="sr-empty">国内<br><b>数据源接入中</b></div>'; return; }
  if (!srFull) { body.innerHTML = '<div class="sr-empty">品种目录加载中…</div>'; return; }
  const kw = srKw.trim().toUpperCase();
  let rows = srFull;
  if (srType !== 'all') rows = rows.filter(r => r.type === srType);
  if (kw) rows = rows.filter(r => r.symbol.includes(kw) || (r.name || '').toUpperCase().includes(kw));
  const shown = rows.slice(0, SR_RENDER_CAP);
  /* 同名品种来自不同数据源时为多行（仿 TradingView），选中即路由到该行数据源 */
  let html = shown.map(r => `<div class="sr-row${r.symbol === curSymbol && r.exchange === curExchange ? ' active' : ''}" data-ex="${r.exchange}" data-sym="${r.symbol}">
      <span class="sr-ico" style="background:${icoFor(r.symbol)}">${(r.symbol[0] || '?').toUpperCase()}</span>
      <span class="sr-sym">${r.symbol}</span>
      <span class="sr-desc">${r.name}</span>
      <span class="sr-type">${TYPE_NAMES[r.type] || r.type || ''}</span>
      <span class="sr-src">${r.source}</span>
    </div>`).join('');
  if (rows.length > shown.length) html += `<div class="sr-more">共 ${rows.length} 个品种，仅显示前 ${shown.length} 个，请输入关键字细化</div>`;
  body.innerHTML = html || '<div class="sr-empty">无匹配品种</div>';
}
function renderSrAll() { renderSrTabs(); renderSrFilter(); renderSrResults(); }
async function openSymSearch() {
  srKw = ''; srType = 'all';
  document.getElementById('sr-input').value = '';
  srModal.classList.add('show');
  renderSrAll();
  if (!srFull) { await loadSrFull(); renderSrAll(); }
  setTimeout(() => document.getElementById('sr-input').focus(), 30);
}
function closeSymSearch() { srModal.classList.remove('show'); }

document.getElementById('sr-tabs').addEventListener('click', e => {
  const b = e.target.closest('.mkt-pill');
  if (b && b.dataset.tp !== srType) { srType = b.dataset.tp; renderSrTabs(); renderSrResults(); }
});
document.getElementById('sr-filter').addEventListener('click', e => {
  const b = e.target.closest('.region-btn');
  if (b && b.dataset.rg !== srRegion) { srRegion = b.dataset.rg; renderSrFilter(); renderSrResults(); }
});
document.getElementById('sr-input').addEventListener('input', e => { srKw = e.target.value; renderSrResults(); });
document.getElementById('sr-body').addEventListener('click', e => {
  const row = e.target.closest('.sr-row');
  if (!row) return;
  const ex = row.dataset.ex, sym = row.dataset.sym;
  /* 切到该行数据源 + 品种（上层链路无感知） */
  if (ex !== curExchange) switchExchange(ex, { symbol: sym });
  else switchSymbol(sym);
  /* 品种列表尚无该品种时加入首个分组并订阅 */
  const groups = groupsFor(ex);
  if (!groups.some(g => g.symbols.some(s => s.sym === sym))) {
    if (!groups.length) groups.push({ name: MARKET_NAMES[MARKET_OF_EX[ex]] || ex, collapsed: false, symbols: [] });
    groups[0].symbols.push({ name: sym, sym, price: null, chg: '--' });
    renderSymbols(); resyncListTopics(); refreshListPrices();
  }
  closeSymSearch();
});
document.getElementById('sr-close').addEventListener('click', closeSymSearch);
srModal.addEventListener('click', e => { if (e.target === srModal) closeSymSearch(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && srModal.classList.contains('show')) closeSymSearch(); });
document.getElementById('symbol-picker').addEventListener('click', openSymSearch);

/* ═══ 拖拽调整栏宽/栏高（分隔条 resize） ═══ */
const SPLIT_CONF = {
  trade: { cssVar: '--trade-w', min: 230, max: 520, def: 300, axis: 'x' },
  sym:   { cssVar: '--sym-w',   min: 200, max: 420, def: 264, axis: 'x' },
  pos:   { cssVar: '--pos-h',   min: 64,  max: 480, def: 150, axis: 'y' },
};
const posBar = document.getElementById('pos-bar');

document.querySelectorAll('.split').forEach(split => {
  split.addEventListener('pointerdown', e => {
    e.preventDefault();
    split.setPointerCapture(e.pointerId);
    split.classList.add('dragging');
    document.body.style.userSelect = 'none';
    document.body.style.cursor = split.classList.contains('split-h') ? 'row-resize' : 'col-resize';
    const conf = SPLIT_CONF[split.dataset.r];
    const root = document.documentElement;
    const startX = e.clientX, startY = e.clientY;
    // 面板在分隔条左侧/下侧 → 向左/向上拖变宽变高
    let startW = parseFloat(getComputedStyle(root).getPropertyValue(conf.cssVar)) || conf.def;
    if (split.dataset.r === 'pos') {
      posBar.classList.remove('collapsed');          // 折叠态下拖拽 → 先展开再调整
      startW = posBar.offsetHeight || conf.def;      // 取实际渲染高度，避免读到变量残留值
    }

    const onMove = ev => {
      const delta = conf.axis === 'x' ? ev.clientX - startX : ev.clientY - startY;
      const w = Math.min(conf.max, Math.max(conf.min, startW - delta));
      root.style.setProperty(conf.cssVar, w + 'px');
    };
    const onUp = ev => {
      split.releasePointerCapture(ev.pointerId);
      split.classList.remove('dragging');
      document.body.style.userSelect = '';
      document.body.style.cursor = '';
      saveLayout();
      split.removeEventListener('pointermove', onMove);
      split.removeEventListener('pointerup', onUp);
      split.removeEventListener('pointercancel', onUp);
    };
    split.addEventListener('pointermove', onMove);
    split.addEventListener('pointerup', onUp);
    split.addEventListener('pointercancel', onUp);
  });
  // 双击恢复默认尺寸
  split.addEventListener('dblclick', () => {
    const conf = SPLIT_CONF[split.dataset.r];
    document.documentElement.style.setProperty(conf.cssVar, conf.def + 'px');
    if (split.dataset.r === 'pos') posBar.classList.remove('collapsed');
    saveLayout();
  });
});

/* ═══ 持仓栏隐藏/显示 ═══ */
document.getElementById('pos-toggle').addEventListener('click', () => {
  posBar.classList.toggle('collapsed');
  saveLayout();
});

/* ═══ 启动（所有定义就绪后；先拉市场源注册表再初始化图表链路） ═══ */
(async () => {
  await initSources();
  updateModeBadge();
  await fetchBackendMeta();   // IND-110：后端 def 式指标目录（失败不阻塞内置指标）
  rebuildIndicators();   // 按 indLayout 构建指标实例（首屏数据就绪前，series 空数据）
  connectWS();
  load();
  fetchTopTicker(); setInterval(fetchTopTicker, 15000);
  fetchPositions(); setInterval(fetchPositions, 5000);
  refreshListPrices(); setInterval(refreshListPrices, 30000);   // 价格已走 WS 同频推送，轮询仅兜底涨跌幅
})();
</script>
