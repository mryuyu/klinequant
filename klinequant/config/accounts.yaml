# KlineQuant 账户配置（Phase 0：多账户 / 本地 / 远程，一进程一账户）
#
# 约定：
#   - 凭证一律以 ${ENV_VAR} 引用，真实值放 klinequant/.env，明文绝不落本文件。
#   - 插值：${VAR} 严格（未设置即报错，不回退空串）；${VAR:-default} 允许缺省。
#     MT5 连接参数全可选，用 ${VAR:-}（缺省=连本机已登录终端）；加密凭证用严格 ${VAR}
#     （仅在实际 --account 选用该账户时才校验，故不影响 FX 主账户运行）。
#   - 解析优先级：CLI --account > env KQ_ACCOUNT > main:true。
#   - market: fx 用 mt5 段；market: crypto 用 binance 段。
#   - role: standalone（默认）| lead | follower（Phase 3 信号分发：lead 广播白名单指令、follower 跟单）。
#   - 远程外汇账户两种形态：①本机多终端各自登录远程平台（server 平台名 + host IP）属本配置层；
#     ②终端在远程机器（VPS）须部署 OrderAgent，归 Phase 3。

accounts:
  # ─── 外汇主账户（MT5 Demo）───
  - name: fx-demo-main
    market: fx
    main: true
    role: standalone
    mt5:
      terminal_path: "${MT5_TERMINAL_PATH:-}"   # 空=连本机已运行终端；多账户=各自 portable 目录
      login: "${MT5_LOGIN:-}"                    # 账户号（空=用终端已登录账户）
      password: "${MT5_PASSWORD:-}"
      server: "${MT5_SERVER:-}"                  # 平台名称（远程平台=登录参数指向远程服务器）
      host: ""                                   # 可选 IP（终端在远程机器时归 Phase 3 OrderAgent）

  # ─── 加密账户（币安 USDT-M Futures Demo，APIKEY 天然远程）───
  - name: crypto-demo
    market: crypto
    role: standalone
    binance:
      api_key: "${BINANCE_FUTURES_API_KEY}"
      api_secret: "${BINANCE_FUTURES_API_SECRET}"
      testnet: true
      proxy: "${HTTP_PROXY:-}"
      rest_base: "${BINANCE_FUTURES_REST_BASE:-https://demo-fapi.binance.com}"
      ws_base: "${BINANCE_FUTURES_WS_BASE:-wss://demo-fstream.binance.com/ws}"

  # ─── Phase 3 信号分发样例（取消注释即用；token 明文只放 .env）───
  #
  # 约定字段（落 AccountConfig.extra，由 scripts 消费）：
  #   lead     ：intent_endpoint（PUB bind）/ report_endpoint（SUB bind）/ token
  #              / heartbeat_interval（可选，默认 2s）
  #   follower ：scale / scale_mode(fixed|balance) / symbol_map / lead_intent_endpoint
  #              （SUB connect 到 lead 的 intent_endpoint）/ report_endpoint（PUB connect
  #              到 lead 的 report_endpoint）/ token / lead_timeout（可选，默认 10s）
  #   token 一律 ${KQ_LEAD_TOKEN}（lead/follower 必须一致；.env 里设一次）。
  #   默认端点 intent=tcp://127.0.0.1:5560、report=tcp://127.0.0.1:5561（跨机时把
  #   127.0.0.1 换成 lead 主机 IP，或走 SSH 隧道 / frp）。

  # ── lead（加密）：跑 run_crypto_live.py --account crypto-lead ──
  # 复用已验证的 BINANCE_API_KEY/SECRET（USDT-M Futures 测试网，余额 5000 USDT）
  - name: crypto-lead
    market: crypto
    role: lead
    intent_endpoint: "tcp://127.0.0.1:5560"   # 广播下单/撤单/清仓/心跳（PUB bind）
    report_endpoint: "tcp://127.0.0.1:5561"   # 聚合 follower 回报（SUB bind，反向扇入）
    token: "${KQ_LEAD_TOKEN}"
    binance:
      api_key: "${BINANCE_API_KEY}"
      api_secret: "${BINANCE_API_SECRET}"
      testnet: true
      proxy: "${HTTP_PROXY:-}"
      rest_base: "${BINANCE_FAPI_REST_BASE:-https://demo-fapi.binance.com}"
      ws_base: "${BINANCE_FAPI_WS_BASE:-wss://demo-fstream.binance.com/ws}"

  # ── follower（加密）：跑 run_order_agent.py --account crypto-follower-1 --market crypto ──
  # 第二套币安 demo 子账户凭证，需先在 .env 填 BINANCE_FOLLOWER1_API_KEY/SECRET
  - name: crypto-follower-1
    market: crypto
    role: follower
    scale: 0.5                                 # fixed 模式：qty×0.5
    scale_mode: fixed                          # fixed | balance（balance 按余额比缩放）
    symbol_map: { BTCUSDT: BTCUSDT }           # lead 品种 → follower 品种（空=恒等）
    lead_intent_endpoint: "tcp://127.0.0.1:5560"  # connect 到 lead intent_endpoint
    report_endpoint: "tcp://127.0.0.1:5561"       # connect 到 lead report_endpoint
    token: "${KQ_LEAD_TOKEN}"
    lead_timeout: 10                           # 心跳龄超此值 → hold 新开仓
    binance:
      api_key: "${BINANCE_FOLLOWER1_API_KEY}"     # follower 独立子账户凭证
      api_secret: "${BINANCE_FOLLOWER1_API_SECRET}"
      testnet: true
      proxy: "${HTTP_PROXY:-}"
      rest_base: "${BINANCE_FAPI_REST_BASE:-https://demo-fapi.binance.com}"
      ws_base: "${BINANCE_FAPI_WS_BASE:-wss://demo-fstream.binance.com/ws}"

  # ── follower 样例（外汇，终端在远程机器 / 本机多终端）：run_order_agent.py --account fx-follower-1 --market fx ──
  # - name: fx-follower-1
  #   market: fx
  #   role: follower
  #   scale: 0.5                          # 固定倍数（scale_mode: fixed）
  #   scale_mode: fixed
  #   symbol_map: { EURUSD: EURUSD.m }    # 券商后缀差异
  #   lead_intent_endpoint: "tcp://127.0.0.1:5560"
  #   report_endpoint: "tcp://127.0.0.1:5561"
  #   token: "${KQ_LEAD_TOKEN}"
  #   mt5:
  #     terminal_path: "${MT5_TERMINAL_PATH_2:-}"
  #     login: "${MT5_LOGIN_2:-}"
  #     password: "${MT5_PASSWORD_2:-}"
  #     server: "${MT5_SERVER_2:-}"
