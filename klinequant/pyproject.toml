[project]
name = "klinequant"
version = "1.0.0"
description = "面向专业量化交易者的小型团队级量化交易平台"
requires-python = ">=3.10"
dependencies = [
    # === 通信 ===
    "pyzmq>=26.0",
    "msgpack>=1.0",
    # === Web ===
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    # === 数据库 ===
    "duckdb>=1.0",
    "clickhouse-connect>=0.7",       # ClickHouse Python 驱动
    "sqlalchemy>=2.0",               # 仅用于 DuckDB ORM（可选）
    # === 缓存 ===
    "redis>=5.0",
    "hiredis>=2.3",
    # === HTTP ===
    "httpx>=0.27",
    "aiohttp>=3.9",
    # === 数据 ===
    "numpy>=1.26",
    "polars>=1.0",                   # 主选：指标计算引擎（Rust 底层，多线程）
    "pandas>=2.2",                   # 备选：降级兼容（polars 不可用时回退）
    "pyarrow>=16.0",                 # Parquet 读写（DuckDB 配合）
    # === 指标 ===（基于 polars 自行实现，无需第三方指标库）
    # === 工具 ===
    "loguru>=0.7",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
mt5 = [
    "MetaTrader5>=5.0",             # 本地 MT5 终端接入（仅 Windows）；缺失时 mt5 插件跳过注册
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 在 conftest.py 中设置 event_loop_policy

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
